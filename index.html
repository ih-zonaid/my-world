<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>My World</title>
    <style>
      html, body, #root { margin: 0; height: 100%; overflow: hidden; background: #9ad1f5; }
      body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; font-family: system-ui, sans-serif; }
      #hint { position: fixed; top: 12px; left: 12px; z-index: 6; color: #fff; font-size: 13px; text-shadow: 0 1px 3px #0008; pointer-events: none; }
      #hotbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 6; display: flex; gap: 8px; }
      /* Cloud/white wash: fades in fast during the dive, fades out slowly on landing. */
      #wash { position: fixed; inset: 0; z-index: 5; background: #eaf4ff; opacity: 0; pointer-events: none; transition: opacity 1.6s ease; }
      #wash.descend { opacity: 1; transition: opacity 0.8s ease-in; }
      #enter { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; color: #fff; font-size: 15px; padding: 9px 16px; border-radius: 22px; background: #00000055; text-shadow: 0 1px 4px #000a; pointer-events: none; }
      #hotbar button { position: relative; width: 46px; height: 46px; padding: 0; border: 2px solid #ffffff44; border-radius: 9px; background: #00000055; display: grid; place-items: center; cursor: pointer; }
      #hotbar button.active { border-color: #fff; background: #ffffff33; }
      #hotbar button:disabled { opacity: 0.35; cursor: not-allowed; }
      #hotbar .dot { width: 24px; height: 24px; border-radius: 5px; }
      #hotbar .dot.erase { background: repeating-linear-gradient(45deg, #ff6b6b99 0 4px, #00000000 4px 8px); border: 1px dashed #fff8; }
      #hotbar .dot.store { display: grid; place-items: center; font-size: 15px; font-weight: 700; color: #ffd25e; background: #ffffff14; }
      #hotbar .num { position: absolute; right: 4px; bottom: 1px; font-size: 10px; color: #fff9; }
      #hotbar .cnt { position: absolute; left: 4px; top: 1px; font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000c; }

      /* Game-style shop sidebar. */
      #shop { position: fixed; top: 12px; right: 12px; width: 268px; z-index: 7; padding: 10px; border: 1px solid #ffffff22; border-radius: 12px; background: #0d1220ee; color: #fff; font-size: 13px; backdrop-filter: blur(6px); }
      #shop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-weight: 600; letter-spacing: .02em; }
      #shop-head button { border: none; background: none; color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
      #shop-wallet { margin-bottom: 8px; color: #ffd25e; font-weight: 600; }
      #shop-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
      #shop-tabs button { flex: 1; padding: 5px 0; border: 1px solid #ffffff22; border-radius: 7px; background: #ffffff10; color: #fffc; font: inherit; cursor: pointer; }
      #shop-tabs button.active { border-color: #fff; background: #ffffff2e; color: #fff; }
      #shop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      #shop-grid .slot { position: relative; aspect-ratio: 1; padding: 0; border: 1px solid #ffffff22; border-radius: 8px; background: #ffffff10; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; overflow: hidden; }
      #shop-grid .slot:hover { background: #ffffff22; }
      #shop-grid .slot.on { border-color: #ffd25e; background: #ffd25e22; }
      #shop-grid .slot .swatch { width: 22px; height: 22px; border-radius: 5px; }
      #shop-grid .slot .count { position: absolute; right: 3px; top: 1px; font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000c; }
      #shop-grid .slot .label { font-size: 9px; color: #fffc; line-height: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .shop-note { margin-top: 8px; font-size: 11px; color: #ffffff99; }
      #shop-list { display: flex; flex-direction: column; gap: 6px; }
      #shop .shop-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid #ffffff22; border-radius: 8px; background: #ffffff10; color: #fff; font: inherit; text-align: left; cursor: pointer; }
      #shop .shop-item:hover:not(:disabled) { background: #ffffff22; }
      #shop .shop-item:disabled { opacity: 0.45; cursor: not-allowed; }
      #shop .shop-item .swatch { width: 18px; height: 18px; border-radius: 4px; flex: none; }
      #shop .shop-item .name { flex: 1; }
      #shop .shop-item .stock { color: #ffffff88; font-size: 11px; }
      #shop .shop-item .price { color: #ffd25e; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
